name: CI Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ArtemisBanking.sln

    - name: Build
      run: dotnet build ArtemisBanking.sln --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test ArtemisBanking.sln --no-build --configuration Release --verbosity normal
